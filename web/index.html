<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo de materiales y cotizador de Expresiones en Huancayo. Prepara tu solicitud y envíala por WhatsApp.">
  <meta name="theme-color" content="#191816">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Expresiones">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Expresiones | Catálogo y cotizador</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="app-loading-shell">
    <style>
      #app-loading-shell {
        position: fixed;
        inset: 0;
        background: #F7F4EF;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999999;
      }
      .shell-spinner {
        width: 42px;
        height: 42px;
        border: 3px solid #E8E3DA;
        border-top-color: #D76582;
        border-radius: 50%;
        animation: shell-spin 0.8s linear infinite;
      }
      .shell-brand {
        margin-top: 16px;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -0.3px;
        color: #191816;
      }
      .shell-sub {
        margin-top: 5px;
        font-size: 13px;
        color: #7B7771;
      }
      @keyframes shell-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <div class="shell-spinner"></div>
    <div class="shell-brand">Expresiones</div>
    <div class="shell-sub">Cargando catálogo...</div>
  </div>
  <script>
    function removeLoadingShell() {
      var shell = document.getElementById('app-loading-shell');
      if (shell) shell.remove();
    }
    window.addEventListener('flutter-first-frame', removeLoadingShell);
    // Fallback: remove after 10s or when flutter-view appears
    var observer = new MutationObserver(function() {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
        removeLoadingShell();
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
    setTimeout(removeLoadingShell, 10000);
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Limpieza proactiva de Service Workers y CacheStorage antiguos
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(keys) {
        for (var i = 0; i < keys.length; i++) {
          caches.delete(keys[i]);
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
