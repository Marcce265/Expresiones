project_id = "expresiones"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "https://expresiones.pages.dev"
additional_redirect_urls = ["https://expresiones.pages.dev/admin/", "http://localhost:3000", "http://127.0.0.1:3000"]
enable_signup = true

[auth.email]
enable_confirmations = false
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.sms]
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.vector]
enabled = false
